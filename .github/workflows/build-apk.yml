name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Assets
        run: npx cap sync android

      - name: Build Debug Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/HisaabKitab.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HisaabKitab-Android-APK
          path: android/app/build/outputs/apk/debug/HisaabKitab.apk
          if-no-files-found: error

      - name: Publish Public Direct APK Release
        run: |
          gh release delete v1.0.0 --yes || true
          gh release create v1.0.0 android/app/build/outputs/apk/debug/HisaabKitab.apk android/app/build/outputs/apk/debug/app-debug.apk --title "Hisaab Kitab Android App v1.0.0" --notes "Direct 1-click single APK file download."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
