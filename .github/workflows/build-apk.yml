name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install -g @capacitor/cli

      - name: Build Web Application
        run: npm run build

      - name: Copy Web Assets to Android
        run: |
          npx cap copy android || (mkdir -p android/app/src/main/assets/public && cp -r dist/* android/app/src/main/assets/public/)

      - name: Build Debug Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon > gradle_log.txt 2>&1 || (cat gradle_log.txt && exit 1)
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/HisaabKitab.apk

      - name: Upload Sync Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Capacitor-Sync-Log
          path: sync_log.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HisaabKitab-Android-APK
          path: android/app/build/outputs/apk/debug/HisaabKitab.apk
          if-no-files-found: error

      - name: Publish Public Direct APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "Hisaab Kitab Android App v1.0.1"
          body: "Direct 1-click single APK file download."
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/HisaabKitab.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
