name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Copy Assets to Android
        run: npx cap copy android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Prepare Standalone APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FundsLogger.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FundsLogger-debug-apk
          path: FundsLogger.apk

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Funds Logger Standalone Android App v1.0.0"
          body: "Official standalone native Android APK file for Funds Logger. Completely independent app with its own native launcher icon and zero Chrome browser dependency."
          files: FundsLogger.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
