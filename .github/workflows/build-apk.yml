name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build web bundle
        run: |
          npm install
          npm run build

      - name: Initialize Capacitor Android Project & Build APK
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.fundslogger.app",
            "appName": "Funds Logger",
            "webDir": "dist",
            "server": {
              "url": "https://hisaab-kitab-dusky.vercel.app",
              "cleartext": false
            }
          }
          EOF
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../FundsLogger.apk

      - name: Publish APK to GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0-apk
          name: Funds Logger Android App (APK)
          body: "Direct installable Android APK for Funds Logger (`FundsLogger.apk`)."
          prerelease: false
          make_latest: true
          files: FundsLogger.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
